name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Validates the plugin against the published @deepseek-ai packages and
  # produces the installable tarball. No DSH checkout required.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Pack tarball
        run: pnpm run pack

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: dsh-doc-review-tarball
          path: dist/*.tgz
          if-no-files-found: error

  # Runs the unit suite. The specs resolve the @deepseek-ai client packages as
  # source from a sibling DSH checkout (mirroring the local dev setup); when
  # that checkout cannot be fetched, the suite degrades to passWithNoTests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Fetch sibling DSH source (vitest resolves @deepseek-ai from it)
        run: git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git ../deepseek-harness
        continue-on-error: true

      - name: Install DSH workspace (source resolution for tests)
        run: |
          if [ -d ../deepseek-harness/packages ]; then
            (cd ../deepseek-harness && pnpm install --frozen-lockfile)
          fi
        continue-on-error: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test
